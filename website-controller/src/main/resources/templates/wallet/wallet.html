<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Wallet — EShoppingZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Alerts Fragment -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="container my-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none text-muted">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Digital Wallet</li>
            </ol>
        </nav>

        <div class="row g-4">
            <!-- Left: Digital Wallet Card Display -->
            <div class="col-lg-5">
                <div class="digital-wallet-card h-100 d-flex flex-column justify-content-between">
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <span class="badge px-3 py-2 rounded-pill fw-bold" style="background-color: var(--primary); color: white;">E-Wallet</span>
                            <span class="fw-bold tracking-wider text-light small">EShoppingZone Pay</span>
                        </div>
                        <p class="text-muted small mb-1 text-uppercase">Available Balance</p>
                        <div class="wallet-balance-amount mb-4">
                            ₹<span th:text="${wallet != null ? #numbers.formatDecimal(wallet.currentBalance, 1, 2) : '0.00'}">0.00</span>
                        </div>
                    </div>

                    <div>
                        <div class="d-flex justify-content-between align-items-end text-muted small border-top border-secondary pt-3">
                            <div>
                                <span class="d-block text-secondary small">Wallet ID</span>
                                <span class="fw-bold text-light">#<span th:text="${wallet != null ? wallet.walletId : '1'}">101</span></span>
                            </div>
                            <div>
                                <span class="d-block text-secondary small">Account Holder</span>
                                <span class="fw-bold text-light" th:text="${currentUser.fullName}">User</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Add Funds Form & Statement Link -->
            <div class="col-lg-7">
                <div class="surface-card shadow-sm p-4 mb-4">
                    <h4 class="fw-bold mb-3 border-bottom pb-2">Add Money to Wallet</h4>
                    <p class="text-muted small mb-4">Top up your wallet balance for seamless checkout.</p>

                    <!-- Add Money Form -->
                    <form th:action="@{/wallet/add-money}" method="post">
                        <!-- Quick Amount Preset Buttons -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">Quick Select Amount</label>
                            <div class="d-flex flex-wrap gap-2">
                                <button type="button" class="btn btn-outline-custom btn-sm" onclick="document.getElementById('amount').value='500'">+₹500</button>
                                <button type="button" class="btn btn-outline-custom btn-sm" onclick="document.getElementById('amount').value='1000'">+₹1,000</button>
                                <button type="button" class="btn btn-outline-custom btn-sm" onclick="document.getElementById('amount').value='2000'">+₹2,000</button>
                                <button type="button" class="btn btn-outline-custom btn-sm" onclick="document.getElementById('amount').value='5000'">+₹5,000</button>
                                <button type="button" class="btn btn-outline-custom btn-sm" onclick="document.getElementById('amount').value='10000'">+₹10,000</button>
                            </div>
                        </div>

                        <!-- Custom Amount Input -->
                        <div class="mb-3">
                            <label for="amount" class="form-label small fw-bold text-secondary">Enter Amount (₹) *</label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" step="0.01" min="1" class="form-control" id="amount" name="amount" placeholder="500.00" required>
                            </div>
                        </div>

                        <!-- Optional Remarks -->
                        <div class="mb-4">
                            <label for="remarks" class="form-label small fw-bold text-secondary">Remarks / Note</label>
                            <input type="text" class="form-control" id="remarks" name="remarks" placeholder="Top-up">
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-bold">
                            Add Money to Wallet
                        </button>
                    </form>
                </div>

                <!-- Link to Statement -->
                <div class="surface-card p-3 shadow-sm d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="fw-bold mb-0">Statement & Transaction History</h6>
                        <small class="text-muted">Review all previous wallet credits and debits</small>
                    </div>
                    <a th:href="@{/wallet/transactions}" class="btn btn-outline-custom btn-sm">
                        View Statement &rarr;
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
