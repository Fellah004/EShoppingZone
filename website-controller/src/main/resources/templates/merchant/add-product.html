<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product — Merchant — EShoppingZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Alerts Fragment -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="container my-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/merchant/dashboard}" class="text-decoration-none text-muted">Merchant Dashboard</a></li>
                <li class="breadcrumb-item"><a th:href="@{/merchant/products}" class="text-decoration-none text-muted">My Products</a></li>
                <li class="breadcrumb-item active" aria-current="page">Add Product</li>
            </ol>
        </nav>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="surface-card p-4 p-md-5 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                        <div>
                            <h3 class="fw-bold mb-1">Add New Product</h3>
                            <p class="text-muted small mb-0">Create and list a new item in the catalog</p>
                        </div>
                        <a th:href="@{/merchant/products}" class="btn btn-outline-custom btn-sm">&larr; Back to Products</a>
                    </div>

                    <!-- Add Product Form -->
                    <form th:action="@{/merchant/products/add}" th:object="${productRequest}" method="post">
                        <!-- Product Title -->
                        <div class="mb-3">
                            <label for="productName" class="form-label small fw-bold text-secondary">Product Name *</label>
                            <input type="text" class="form-control" th:field="*{productName}" placeholder="e.g. Sony WH-1000XM5 Wireless Headphones" required>
                            <div th:if="${#fields.hasErrors('productName')}" class="text-danger small mt-1" th:errors="*{productName}">Name error</div>
                        </div>

                        <!-- Product Type & Category -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="category" class="form-label small fw-bold text-secondary">Category *</label>
                                <select class="form-select" th:field="*{category}" required>
                                    <option value="" disabled selected>Select Category</option>
                                    <option value="Electronics">Electronics</option>
                                    <option value="Books">Books</option>
                                    <option value="Apparel">Apparel</option>
                                    <option value="Personal Care">Personal Care</option>
                                </select>
                                <div th:if="${#fields.hasErrors('category')}" class="text-danger small mt-1" th:errors="*{category}">Category error</div>
                            </div>
                            <div class="col-md-6">
                                <label for="productType" class="form-label small fw-bold text-secondary">Product Type *</label>
                                <input type="text" class="form-control" th:field="*{productType}" placeholder="e.g. Headphones, Smartphone, Shirt" required>
                                <div th:if="${#fields.hasErrors('productType')}" class="text-danger small mt-1" th:errors="*{productType}">Type error</div>
                            </div>
                        </div>

                        <!-- Manufacturer & Price -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="manufacturer" class="form-label small fw-bold text-secondary">Manufacturer / Brand *</label>
                                <input type="text" class="form-control" th:field="*{manufacturer}" placeholder="e.g. Sony, Apple, Raymond" required>
                                <div th:if="${#fields.hasErrors('manufacturer')}" class="text-danger small mt-1" th:errors="*{manufacturer}">Brand error</div>
                            </div>
                            <div class="col-md-6">
                                <label for="price" class="form-label small fw-bold text-secondary">Base Price (₹ INR) *</label>
                                <div class="input-group">
                                    <span class="input-group-text">₹</span>
                                    <input type="number" step="0.01" min="1" class="form-control" th:field="*{price}" placeholder="2999.00" required>
                                </div>
                                <div th:if="${#fields.hasErrors('price')}" class="text-danger small mt-1" th:errors="*{price}">Price error</div>
                            </div>
                        </div>

                        <!-- Stock, Threshold & Discount -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="stockQuantity" class="form-label small fw-bold text-secondary">Initial Stock Quantity</label>
                                <input type="number" min="0" class="form-control" th:field="*{stockQuantity}" placeholder="100">
                            </div>
                            <div class="col-md-4">
                                <label for="lowStockThreshold" class="form-label small fw-bold text-secondary">Low Stock Alert Level</label>
                                <input type="number" min="1" class="form-control" th:field="*{lowStockThreshold}" placeholder="10">
                            </div>
                            <div class="col-md-4">
                                <label for="discountPercent" class="form-label small fw-bold text-secondary">Discount (%)</label>
                                <div class="input-group">
                                    <input type="number" step="0.1" min="0" max="90" class="form-control" th:field="*{discountPercent}" placeholder="0.0">
                                    <span class="input-group-text">%</span>
                                </div>
                            </div>
                        </div>

                        <!-- Image URL -->
                        <div class="mb-3">
                            <label for="image" class="form-label small fw-bold text-secondary">Image URL</label>
                            <input type="url" class="form-control" th:field="*{image}" placeholder="https://images.unsplash.com/...">
                            <div class="form-text small">Provide a direct image URL (HTTPS).</div>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label small fw-bold text-secondary">Description</label>
                            <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Detailed product overview and benefits..."></textarea>
                        </div>

                        <!-- Specifications -->
                        <div class="mb-4">
                            <label for="specification" class="form-label small fw-bold text-secondary">Specifications</label>
                            <textarea class="form-control" th:field="*{specification}" rows="3" placeholder="Display: 6.5-inch | RAM: 8GB | Battery: 5000mAh"></textarea>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a th:href="@{/merchant/products}" class="btn btn-outline-custom">Cancel</a>
                            <button type="submit" class="btn btn-primary-custom px-4 py-2 fw-bold">
                                Save & List Product
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
