<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — EShoppingZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Alerts Fragment -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="surface-card shadow-sm p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-logo justify-content-center mb-2">
                            <span class="brand-icon">E</span>
                            <span>EShopping</span>Zone
                        </div>
                        <h4 class="fw-bold mb-1">Create Account</h4>
                        <p class="text-muted small">Register to browse, order, and manage your e-wallet</p>
                    </div>

                    <!-- Registration Form -->
                    <form th:action="@{/register}" method="post">
                        <!-- Personal Information -->
                        <h6 class="fw-bold text-uppercase text-secondary small mb-3 border-bottom pb-2">1. Personal Information</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="fullName" class="form-label small fw-bold text-secondary">Full Name *</label>
                                <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Rahul Sharma" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label small fw-bold text-secondary">Email Address *</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="rahul@example.com" required>
                            </div>
                            <div class="col-md-6">
                                <label for="password" class="form-label small fw-bold text-secondary">Password *</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
                            </div>
                            <div class="col-md-6">
                                <label for="mobileNumber" class="form-label small fw-bold text-secondary">Mobile Number *</label>
                                <input type="tel" class="form-control" id="mobileNumber" name="mobileNumber" placeholder="9876543210" required>
                            </div>
                            <div class="col-md-4">
                                <label for="dateOfBirth" class="form-label small fw-bold text-secondary">Date of Birth</label>
                                <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth">
                            </div>
                            <div class="col-md-4">
                                <label for="gender" class="form-label small fw-bold text-secondary">Gender</label>
                                <select class="form-select" id="gender" name="gender">
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="role" class="form-label small fw-bold text-secondary">Account Role *</label>
                                <select class="form-select" id="role" name="role" required onchange="toggleBusinessName(this.value)">
                                    <option value="CUSTOMER" th:selected="${selectedRole == 'CUSTOMER'}">Customer</option>
                                    <option value="MERCHANT" th:selected="${selectedRole == 'MERCHANT'}">Merchant / Seller</option>
                                    <option value="DELIVERY_AGENT" th:selected="${selectedRole == 'DELIVERY_AGENT'}">Delivery Agent</option>
                                </select>
                            </div>
                            <div class="col-md-6" id="businessNameGroup">
                                <label for="businessName" class="form-label small fw-bold text-secondary">Business / Store Name</label>
                                <input type="text" class="form-control" id="businessName" name="businessName" placeholder="e.g. Acme Retailers">
                            </div>
                            <div class="col-md-6">
                                <label for="about" class="form-label small fw-bold text-secondary">About / Bio</label>
                                <input type="text" class="form-control" id="about" name="about" placeholder="Short bio or description">
                            </div>
                        </div>

                        <!-- Delivery Agent Vehicle Information (shown for DELIVERY_AGENT) -->
                        <div id="vehicleInfoGroup" style="display: none;">
                            <h6 class="fw-bold text-uppercase text-secondary small mb-3 border-bottom pb-2">2. Vehicle &amp; Delivery Specialist Information</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label for="vehicleType" class="form-label small fw-bold text-secondary">Vehicle Type</label>
                                    <select class="form-select" id="vehicleType" name="vehicleType">
                                        <option value="Motorcycle / Bike">Motorcycle / Bike</option>
                                        <option value="Scooter">Scooter</option>
                                        <option value="Electric Vehicle (EV)">Electric Vehicle (EV)</option>
                                        <option value="Delivery Van">Delivery Van</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label for="vehicleNumber" class="form-label small fw-bold text-secondary">Vehicle Number Plate</label>
                                    <input type="text" class="form-control" id="vehicleNumber" name="vehicleNumber" placeholder="e.g. KA-01-AB-1234">
                                </div>
                                <div class="col-md-4">
                                    <label for="drivingLicenseNumber" class="form-label small fw-bold text-secondary">Driving License Number</label>
                                    <input type="text" class="form-control" id="drivingLicenseNumber" name="drivingLicenseNumber" placeholder="e.g. DL-0420110012345">
                                </div>
                            </div>
                        </div>

                        <!-- Address Information -->
                        <h6 class="fw-bold text-uppercase text-secondary small mb-3 border-bottom pb-2" id="addressHeader">2. Address Information</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label for="houseNumber" class="form-label small fw-bold text-secondary">House / Flat No.</label>
                                <input type="text" class="form-control" id="houseNumber" name="address.houseNumber" placeholder="24">
                            </div>
                            <div class="col-md-8">
                                <label for="streetName" class="form-label small fw-bold text-secondary">Street / Road *</label>
                                <input type="text" class="form-control" id="streetName" name="address.streetName" placeholder="MG Road" required>
                            </div>
                            <div class="col-md-6">
                                <label for="colonyName" class="form-label small fw-bold text-secondary">Area / Colony / Landmark</label>
                                <input type="text" class="form-control" id="colonyName" name="address.colonyName" placeholder="Kakkanad">
                            </div>
                            <div class="col-md-6">
                                <label for="city" class="form-label small fw-bold text-secondary">City *</label>
                                <input type="text" class="form-control" id="city" name="address.city" placeholder="Kochi" required>
                            </div>
                            <div class="col-md-6">
                                <label for="state" class="form-label small fw-bold text-secondary">State *</label>
                                <input type="text" class="form-control" id="state" name="address.state" placeholder="Kerala" required>
                            </div>
                            <div class="col-md-6">
                                <label for="pincode" class="form-label small fw-bold text-secondary">PIN Code *</label>
                                <input type="text" class="form-control" id="pincode" name="address.pincode" placeholder="682030" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
                            Create Account
                        </button>
                    </form>

                    <!-- Login Link -->
                    <div class="text-center small text-muted">
                        Already have an account?
                        <a th:href="@{/login}" class="fw-bold text-decoration-none" style="color: var(--primary);">Sign In here</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleBusinessName(role) {
            const bizGroup = document.getElementById('businessNameGroup');
            const vehGroup = document.getElementById('vehicleInfoGroup');
            const addrHeader = document.getElementById('addressHeader');
            if (bizGroup) {
                bizGroup.style.display = (role === 'MERCHANT') ? 'block' : 'none';
            }
            if (vehGroup) {
                vehGroup.style.display = (role === 'DELIVERY_AGENT') ? 'block' : 'none';
            }
            if (addrHeader) {
                addrHeader.innerText = (role === 'DELIVERY_AGENT') ? '3. Base / Home Address' : '2. Address Information';
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            const roleSelect = document.getElementById('role');
            if (roleSelect) {
                toggleBusinessName(roleSelect.value);
            }
        });
    </script>
</body>
</html>
