<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — EShoppingZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Alerts Fragment -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="surface-card shadow-sm p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-logo justify-content-center mb-2">
                            <span class="brand-icon">E</span>
                            <span>EShopping</span>Zone
                        </div>
                        <h4 class="fw-bold mb-1">Sign In</h4>
                        <p class="text-muted small">Access your EShoppingZone account</p>
                    </div>

                    <!-- Login Form -->
                    <form th:action="@{/login}" method="post">
                        <input type="hidden" name="redirect" th:value="${redirect}">

                        <div class="mb-3">
                            <label for="email" class="form-label small fw-bold text-secondary">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required autofocus>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="password" class="form-label small fw-bold text-secondary mb-0">Password</label>
                                <a th:href="@{/forgot-password}" class="small text-decoration-none" style="color: var(--primary);">Forgot Password?</a>
                            </div>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
                            Sign In
                        </button>
                    </form>

                    <!-- Divider -->
                    <div class="d-flex align-items-center my-3">
                        <hr class="flex-grow-1">
                        <span class="px-3 text-muted small text-uppercase">or</span>
                        <hr class="flex-grow-1">
                    </div>

                    <!-- GitHub Login Button -->
                    <a th:href="@{/oauth2/authorization/github}" class="btn btn-outline-custom w-100 py-2 d-flex align-items-center justify-content-center gap-2 mb-4">
                        <svg height="18" width="18" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                        </svg>
                        <span>Continue with GitHub</span>
                    </a>

                    <!-- Register Link -->
                    <div class="text-center small text-muted">
                        Don't have an account?
                        <a th:href="@{/register}" class="fw-bold text-decoration-none" style="color: var(--primary);">Create Account</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
