<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — EShoppingZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Alerts Fragment -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="surface-card shadow-sm p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-logo justify-content-center mb-2">
                            <span class="brand-icon">E</span>
                            <span>EShopping</span>Zone
                        </div>
                        <h4 class="fw-bold mb-1">Forgot Password</h4>
                        <p class="text-muted small">Enter your email address and we'll generate a secure password reset token for your account.</p>
                    </div>

                    <form th:action="@{/forgot-password}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-bold text-secondary">Registered Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required autofocus>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">
                            Send Reset Instructions
                        </button>
                    </form>

                    <div class="text-center small text-muted mt-3">
                        Remember your password?
                        <a th:href="@{/login}" class="fw-bold text-decoration-none" style="color: var(--primary);">Back to Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
