<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
    <!-- Reusable Pagination Fragment -->
    <div th:fragment="pagination(pageData, baseUrl)" th:if="${pageData != null and pageData.totalElements > 0}" class="d-flex flex-wrap justify-content-between align-items-center p-3 border-top bg-light gap-3">
        <!-- Records Counter: Showing 1–10 of 57 items -->
        <div class="text-muted small">
            Showing <strong class="text-dark" th:text="${pageData.startElement}">1</strong>&ndash;<strong class="text-dark" th:text="${pageData.endElement}">10</strong> of <strong class="text-dark" th:text="${pageData.totalElements}">57</strong> items
        </div>

        <!-- Page Numbers & Prev/Next -->
        <nav th:if="${pageData.totalPages > 1}" aria-label="Page navigation">
            <ul class="pagination pagination-sm mb-0">
                <!-- Previous Button -->
                <li class="page-item" th:classappend="${!pageData.hasPrevious ? 'disabled' : ''}">
                    <a class="page-link" th:href="${pageData.hasPrevious ? baseUrl + (baseUrl.contains('?') ? '&' : '?') + 'page=' + (pageData.pageNumber - 1) + '&size=' + pageData.pageSize : '#'}" aria-label="Previous">
                        &laquo; Previous
                    </a>
                </li>

                <!-- Page Numbers -->
                <li th:each="pageNum : ${pageData.pageNumbers}" class="page-item" th:classappend="${pageNum == pageData.pageNumber ? 'active' : ''}">
                    <a class="page-link" th:href="${baseUrl + (baseUrl.contains('?') ? '&' : '?') + 'page=' + pageNum + '&size=' + pageData.pageSize}" th:text="${pageNum}">1</a>
                </li>

                <!-- Next Button -->
                <li class="page-item" th:classappend="${!pageData.hasNext ? 'disabled' : ''}">
                    <a class="page-link" th:href="${pageData.hasNext ? baseUrl + (baseUrl.contains('?') ? '&' : '?') + 'page=' + (pageData.pageNumber + 1) + '&size=' + pageData.pageSize : '#'}" aria-label="Next">
                        Next &raquo;
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Page Size Selector (10, 20, 50) -->
        <div class="d-flex align-items-center gap-2">
            <label class="text-muted small text-nowrap mb-0">Items per page:</label>
            <select class="form-select form-select-sm" style="width: auto;" onchange="location.href = this.value;">
                <option th:value="${baseUrl + (baseUrl.contains('?') ? '&' : '?') + 'page=1&size=10'}" th:selected="${pageData.pageSize == 10}">10</option>
                <option th:value="${baseUrl + (baseUrl.contains('?') ? '&' : '?') + 'page=1&size=20'}" th:selected="${pageData.pageSize == 20}">20</option>
                <option th:value="${baseUrl + (baseUrl.contains('?') ? '&' : '?') + 'page=1&size=50'}" th:selected="${pageData.pageSize == 50}">50</option>
            </select>
        </div>
    </div>
</body>
</html>
