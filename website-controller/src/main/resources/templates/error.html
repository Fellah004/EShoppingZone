<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — EShoppingZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-5 text-center">
        <div class="surface-card p-5 mx-auto shadow-sm" style="max-width: 500px;">
            <h3 class="fw-bold mb-2">Something went wrong</h3>
            <p class="text-muted small mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested page or resource could not be processed.'}">
                An unexpected error occurred.
            </p>
            <a th:href="@{/}" class="btn btn-primary-custom">Return to Home</a>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
