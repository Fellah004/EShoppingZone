<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — EShoppingZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Alerts Fragment -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="container my-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="${currentUser != null and currentUser.loggedIn and currentUser.merchant ? '/merchant/dashboard' : '/'}" class="text-decoration-none text-muted">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">My Profile</li>
            </ol>
        </nav>

        <div class="row g-4">
            <!-- Profile Sidebar Overview -->
            <div class="col-lg-4">
                <div class="surface-card text-center shadow-sm p-4 mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center text-white rounded-circle mb-3 fw-bold" style="background-color: var(--primary); width: 70px; height: 70px; font-size: 1.8rem;">
                        <span th:text="${profile != null and profile.fullName != null ? #strings.substring(profile.fullName, 0, 1) : 'U'}">U</span>
                    </div>
                    <h4 class="fw-bold mb-1" th:text="${profile != null ? profile.fullName : currentUser.fullName}">User Full Name</h4>
                    <p class="text-muted small mb-2" th:text="${profile != null ? profile.email : currentUser.email}">user@example.com</p>
                    <span class="badge mb-3" th:classappend="${profile != null and profile.role == 'ROLE_MERCHANT' ? 'bg-primary' : 'bg-secondary'}" th:text="${profile != null ? profile.role : 'CUSTOMER'}">CUSTOMER</span>

                    <!-- Customer Navigation Links -->
                    <div th:if="${currentUser != null and !currentUser.merchant}" class="list-group list-group-flush text-start border-top pt-2">
                        <a th:href="@{/profile/addresses}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center border-0 px-0 py-2">
                            <span>Manage Addresses</span>
                            <span>&rarr;</span>
                        </a>
                        <a th:href="@{/orders}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center border-0 px-0 py-2">
                            <span>Order History</span>
                            <span>&rarr;</span>
                        </a>
                        <a th:href="@{/wallet}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center border-0 px-0 py-2">
                            <span>Digital Wallet</span>
                            <span>&rarr;</span>
                        </a>
                        <a th:href="@{/wallet/transactions}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center border-0 px-0 py-2">
                            <span>Statement History</span>
                            <span>&rarr;</span>
                        </a>
                    </div>

                    <!-- Merchant Navigation Links -->
                    <div th:if="${currentUser != null and currentUser.merchant}" class="list-group list-group-flush text-start border-top pt-2">
                        <a th:href="@{/merchant/dashboard}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center border-0 px-0 py-2">
                            <span>Merchant Dashboard</span>
                            <span>&rarr;</span>
                        </a>
                        <a th:href="@{/merchant/products}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center border-0 px-0 py-2">
                            <span>My Products</span>
                            <span>&rarr;</span>
                        </a>
                        <a th:href="@{/merchant/sales}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center border-0 px-0 py-2">
                            <span>Customer Sales Ledger</span>
                            <span>&rarr;</span>
                        </a>
                    </div>
                </div>
            </div>

            <!-- Profile Edit & Password Forms -->
            <div class="col-lg-8">
                <div class="surface-card shadow-sm p-4 mb-4">
                    <h4 class="fw-bold mb-3 border-bottom pb-2">Profile Details</h4>

                    <form th:action="@{/profile/edit}" method="post">
                        <!-- Personal Info -->
                        <h6 class="fw-bold text-uppercase text-secondary small mb-3">1. Personal Information</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="fullName" class="form-label small fw-bold text-secondary">Full Name *</label>
                                <input type="text" class="form-control" id="fullName" name="fullName" th:value="${updateRequest.fullName}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="mobileNumber" class="form-label small fw-bold text-secondary">Mobile Number *</label>
                                <input type="tel" class="form-control" id="mobileNumber" name="mobileNumber" th:value="${updateRequest.mobileNumber}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="dateOfBirth" class="form-label small fw-bold text-secondary">Date of Birth</label>
                                <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth" th:value="${updateRequest.dateOfBirth}">
                            </div>
                            <div class="col-md-6">
                                <label for="gender" class="form-label small fw-bold text-secondary">Gender</label>
                                <select class="form-select" id="gender" name="gender">
                                    <option value="Male" th:selected="${updateRequest.gender == 'Male'}">Male</option>
                                    <option value="Female" th:selected="${updateRequest.gender == 'Female'}">Female</option>
                                    <option value="Other" th:selected="${updateRequest.gender == 'Other'}">Other</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label for="about" class="form-label small fw-bold text-secondary">About</label>
                                <input type="text" class="form-control" id="about" name="about" th:value="${updateRequest.about}" placeholder="Brief description about yourself">
                            </div>
                        </div>

                        <!-- Address Info -->
                        <h6 class="fw-bold text-uppercase text-secondary small mb-3 border-top pt-3">2. Default Address</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label for="houseNumber" class="form-label small fw-bold text-secondary">House / Flat No.</label>
                                <input type="text" class="form-control" id="houseNumber" name="address.houseNumber" th:value="${updateRequest.address != null ? updateRequest.address.houseNumber : ''}" placeholder="24">
                            </div>
                            <div class="col-md-8">
                                <label for="streetName" class="form-label small fw-bold text-secondary">Street / Road *</label>
                                <input type="text" class="form-control" id="streetName" name="address.streetName" th:value="${updateRequest.address != null ? updateRequest.address.streetName : ''}" placeholder="MG Road" required>
                            </div>
                            <div class="col-md-6">
                                <label for="colonyName" class="form-label small fw-bold text-secondary">Area / Colony</label>
                                <input type="text" class="form-control" id="colonyName" name="address.colonyName" th:value="${updateRequest.address != null ? updateRequest.address.colonyName : ''}" placeholder="Kakkanad">
                            </div>
                            <div class="col-md-6">
                                <label for="city" class="form-label small fw-bold text-secondary">City *</label>
                                <input type="text" class="form-control" id="city" name="address.city" th:value="${updateRequest.address != null ? updateRequest.address.city : ''}" placeholder="Kochi" required>
                            </div>
                            <div class="col-md-6">
                                <label for="state" class="form-label small fw-bold text-secondary">State *</label>
                                <input type="text" class="form-control" id="state" name="address.state" th:value="${updateRequest.address != null ? updateRequest.address.state : ''}" placeholder="Kerala" required>
                            </div>
                            <div class="col-md-6">
                                <label for="pincode" class="form-label small fw-bold text-secondary">PIN Code *</label>
                                <input type="text" class="form-control" id="pincode" name="address.pincode" th:value="${updateRequest.address != null ? updateRequest.address.pincode : ''}" placeholder="682030" required>
                            </div>
                        </div>

                        <div class="text-end pt-3 border-top">
                            <button type="submit" class="btn btn-primary-custom px-4 py-2">
                                Save Profile
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Change Password Card -->
                <div class="surface-card shadow-sm p-4">
                    <h4 class="fw-bold mb-3 border-bottom pb-2">Change Password</h4>
                    <form th:action="@{/profile/change-password}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="currentPassword" class="form-label small fw-bold text-secondary">Current Password *</label>
                                <input type="password" class="form-control" id="currentPassword" name="currentPassword" placeholder="••••••••" required>
                            </div>
                            <div class="col-md-6">
                                <label for="newPassword" class="form-label small fw-bold text-secondary">New Password *</label>
                                <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="Minimum 6 characters" minlength="6" required>
                            </div>
                        </div>
                        <div class="text-end pt-3 border-top mt-3">
                            <button type="submit" class="btn btn-outline-custom px-4 py-2">
                                Update Password
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
