<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Selection — EShoppingZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Alerts Fragment -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="container my-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none text-muted">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/cart}" class="text-decoration-none text-muted">Cart</a></li>
                <li class="breadcrumb-item"><a th:href="@{/checkout}" class="text-decoration-none text-muted">Checkout</a></li>
                <li class="breadcrumb-item active" aria-current="page">Payment</li>
            </ol>
        </nav>

        <!-- Progress Steps -->
        <div class="d-flex justify-content-center mb-4">
            <div class="d-flex align-items-center gap-3">
                <div class="badge bg-success rounded-circle p-2" style="width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;">✓</div>
                <span class="text-muted">Delivery Address</span>
                <span class="text-muted">&mdash;&mdash;&gt;</span>
                <div class="badge rounded-circle p-2" style="background-color: var(--primary); color: white; width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;">2</div>
                <span class="fw-bold" style="color: var(--primary);">Payment</span>
            </div>
        </div>

        <div class="row g-4">
            <!-- Payment Method Form -->
            <div class="col-lg-7">
                <div class="surface-card shadow-sm">
                    <h4 class="fw-bold mb-3 border-bottom pb-2">Select Payment Method</h4>
                    <p class="text-muted small mb-4">Choose your preferred payment mode.</p>

                    <form th:action="@{/checkout/place-order}" method="post">
                        <!-- Option 1: Digital Wallet -->
                        <div class="form-check p-0 mb-3">
                            <label class="payment-option-card w-100" for="paymentWallet">
                                <input class="form-check-input ms-1 me-2" type="radio" name="paymentMethod" id="paymentWallet" value="WALLET" th:checked="${hasSufficientWalletBalance}">
                                <div class="flex-grow-1">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="fw-bold">E-Wallet Payment</span>
                                        <span class="badge" th:classappend="${hasSufficientWalletBalance ? 'bg-success' : 'bg-warning text-dark'}">
                                            Balance: ₹<span th:text="${#numbers.formatDecimal(walletBalance, 1, 2)}">0.00</span>
                                        </span>
                                    </div>
                                    <div class="text-muted small mt-1">Direct payment from your EShoppingZone wallet balance.</div>
                                    <div th:if="${hasSufficientWalletBalance}" class="text-success small fw-semibold mt-1">
                                        Sufficient balance available for this transaction.
                                    </div>
                                    <div th:unless="${hasSufficientWalletBalance}" class="text-danger small fw-semibold mt-1">
                                        Insufficient balance for this order (₹<span th:text="${#numbers.formatDecimal(cart.totalPrice, 1, 2)}">0.00</span> required).
                                        <a th:href="@{/wallet}" target="_blank" class="text-decoration-underline ms-1" style="color: var(--primary);">Add Money</a>
                                    </div>
                                </div>
                            </label>
                        </div>

                        <!-- Option 2: Cash on Delivery -->
                        <div class="form-check p-0 mb-3">
                            <label class="payment-option-card w-100" for="paymentCod">
                                <input class="form-check-input ms-1 me-2" type="radio" name="paymentMethod" id="paymentCod" value="COD" th:checked="${!hasSufficientWalletBalance}">
                                <div class="flex-grow-1">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="fw-bold">Cash on Delivery (COD)</span>
                                        <span class="badge bg-secondary">Pay on Delivery</span>
                                    </div>
                                    <div class="text-muted small mt-1">Pay with cash when your shipment arrives at your delivery address.</div>
                                </div>
                            </label>
                        </div>

                        <!-- Option 3: Online Payment Gateway -->
                        <div class="form-check p-0 mb-4">
                            <label class="payment-option-card w-100" for="paymentOnline">
                                <input class="form-check-input ms-1 me-2" type="radio" name="paymentMethod" id="paymentOnline" value="ONLINE">
                                <div class="flex-grow-1">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="fw-bold">Online Payment</span>
                                        <span class="badge bg-primary">Card / UPI / NetBanking</span>
                                    </div>
                                    <div class="text-muted small mt-1">Pay securely online using Credit/Debit Card, UPI, or Net Banking.</div>
                                </div>
                            </label>
                        </div>

                        <!-- Shipping Destination Summary -->
                        <div class="p-3 bg-light rounded border mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span class="fw-bold small text-secondary">Delivery Address:</span>
                                <a th:href="@{/checkout}" class="small text-decoration-none" style="color: var(--primary);">Change Address</a>
                            </div>
                            <div class="small text-dark" th:text="${shippingAddress.formattedAddress}">24, MG Road, Kakkanad, Kochi, Kerala - 682030</div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a th:href="@{/checkout}" class="btn btn-outline-custom">&larr; Back to Address</a>
                            <button type="submit" class="btn btn-primary-custom px-4 py-2 fw-bold">
                                Place Order &rarr;
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Cart Summary Overview -->
            <div class="col-lg-5">
                <div class="surface-card shadow-sm">
                    <h5 class="fw-bold mb-3 border-bottom pb-2">Order Summary</h5>
                    <div class="overflow-auto mb-3" style="max-height: 250px;">
                        <div th:each="item : ${cart.items}" class="d-flex align-items-center gap-3 py-2 border-bottom">
                            <img th:src="${item.imageUrl}" th:alt="${item.productName}" class="rounded" style="width: 40px; height: 40px; object-fit: cover;">
                            <div class="flex-grow-1">
                                <div class="fw-bold small text-truncate" style="max-width: 180px;" th:text="${item.productName}">Product</div>
                                <div class="text-muted small">Qty: <span th:text="${item.quantity}">1</span></div>
                            </div>
                            <div class="fw-bold small" style="color: var(--secondary);">
                                ₹<span th:text="${#numbers.formatDecimal(item.subTotal, 1, 2)}">0.00</span>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-baseline pt-2">
                        <span class="fw-bold h5 mb-0">Total Due</span>
                        <span class="fw-bold h4 mb-0" style="color: var(--secondary);">₹<span th:text="${#numbers.formatDecimal(cart.totalPrice, 1, 2)}">0.00</span></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
