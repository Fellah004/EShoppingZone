<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results — EShoppingZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Alerts Fragment -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="container my-4">
        <!-- Breadcrumb & Header -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="${currentUser != null and currentUser.loggedIn and currentUser.merchant ? '/merchant/dashboard' : '/'}" class="text-decoration-none text-muted">Home</a></li>
                <li class="breadcrumb-item"><a th:href="@{/products}" class="text-decoration-none text-muted">Products</a></li>
                <li class="breadcrumb-item active" aria-current="page">Search</li>
            </ol>
        </nav>

        <div class="mb-4">
            <h2 class="fw-bold mb-1">
                Search Results for: <span style="color: var(--primary);" th:text="${searchQuery != null and !searchQuery.isEmpty() ? '&ldquo;' + searchQuery + '&rdquo;' : 'All Products'}">&ldquo;Keyword&rdquo;</span>
            </h2>
            <p class="text-muted small mb-0" th:text="${resultCount + ' product(s) found'}">0 products found</p>
        </div>

        <!-- Product Grid -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
            <div class="col" th:each="product : ${products}">
                <div class="product-card">
                    <div class="product-img-wrapper">
                        <img th:src="${product.image}" th:alt="${product.productName}">
                    </div>
                    <div class="product-card-body">
                        <span class="product-category-tag" th:text="${product.category}">Category</span>
                        <h4 class="product-title">
                            <a th:href="@{/products/{id}(id=${product.productId})}" th:text="${product.productName}">Product Name</a>
                        </h4>
                        <div class="product-price">
                            <span class="currency">₹</span>
                            <span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">0.00</span>
                        </div>
                        <div class="product-actions">
                            <a th:href="@{/products/{id}(id=${product.productId})}" class="btn btn-outline-custom btn-sm flex-grow-1">Details</a>
                            <!-- Add to Cart for Customer/Guest -->
                            <th:block th:unless="${currentUser != null and currentUser.loggedIn and currentUser.merchant}">
                                <form th:action="@{/cart/add}" method="post" class="flex-grow-1">
                                    <input type="hidden" name="productId" th:value="${product.productId}">
                                    <input type="hidden" name="quantity" value="1">
                                    <button type="submit" class="btn btn-primary-custom btn-sm w-100">Add to Cart</button>
                                </form>
                            </th:block>
                            <!-- Edit for Merchant -->
                            <th:block th:if="${currentUser != null and currentUser.loggedIn and currentUser.merchant}">
                                <a th:href="@{/merchant/products/edit/{id}(id=${product.productId})}" class="btn btn-outline-custom btn-sm flex-grow-1">Edit</a>
                            </th:block>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination Controls -->
        <div class="mt-4 surface-card p-0 overflow-hidden shadow-sm" th:if="${pageData != null and pageData.totalElements > 0}">
            <div th:replace="~{fragments/pagination :: pagination(${pageData}, ${baseUrl})}"></div>
        </div>

        <!-- Empty State -->
        <div th:if="${products == null or products.isEmpty()}" class="text-center py-5">
            <div class="p-5 surface-card text-center">
                <h4 class="text-muted mb-3">No products matched your search.</h4>
                <p class="text-secondary small mb-4">Try searching for terms like "OnePlus", "JBL", "Alchemist", "Kurti", or "Face Wash".</p>
                <a th:href="@{/products}" class="btn btn-primary-custom">Browse Full Catalog</a>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
