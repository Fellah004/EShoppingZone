<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart — EShoppingZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Alerts Fragment -->
    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <main class="container my-4">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none text-muted">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Shopping Cart</li>
            </ol>
        </nav>

        <h2 class="fw-bold mb-4">Shopping Cart</h2>

        <!-- Non-Empty Cart View -->
        <div th:if="${cart != null and cart.items != null and !cart.items.isEmpty()}" class="row g-4">
            <!-- Items Table -->
            <div class="col-lg-8">
                <div class="surface-card p-0 overflow-hidden shadow-sm">
                    <div class="table-responsive">
                        <table class="table table-custom mb-0 align-middle">
                            <thead>
                                <tr>
                                    <th style="width: 45%;">Product</th>
                                    <th style="width: 15%;">Price</th>
                                    <th style="width: 20%;">Quantity</th>
                                    <th style="width: 15%;">Subtotal</th>
                                    <th style="width: 5%;">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${cart.items}">
                                    <td>
                                        <div class="d-flex align-items-center gap-3">
                                            <img th:src="${item.imageUrl}"
                                                 th:alt="${item.productName}"
                                                 class="rounded"
                                                 style="width: 55px; height: 55px; object-fit: cover;">
                                            <div>
                                                <a th:href="@{/products/{id}(id=${item.productId})}" class="fw-bold text-decoration-none text-dark d-block mb-1" th:text="${item.productName}">Product Name</a>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="fw-semibold">
                                        ₹<span th:text="${#numbers.formatDecimal(item.price, 1, 2)}">0.00</span>
                                    </td>
                                    <td>
                                        <form th:action="@{/cart/update}" method="post" class="d-flex align-items-center gap-1" style="max-width: 120px;">
                                            <input type="hidden" name="productId" th:value="${item.productId}">
                                            <input type="number" name="quantity" class="form-control form-control-sm text-center" min="1" max="10" th:value="${item.quantity}" onchange="this.form.submit()">
                                        </form>
                                    </td>
                                    <td class="fw-bold" style="color: var(--secondary);">
                                        ₹<span th:text="${#numbers.formatDecimal(item.subTotal, 1, 2)}">0.00</span>
                                    </td>
                                    <td>
                                        <form th:action="@{/cart/remove}" method="post">
                                            <input type="hidden" name="productId" th:value="${item.productId}">
                                            <button type="submit" class="btn btn-sm btn-outline-danger border-0 p-1" title="Remove product">
                                                <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                                    <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
                                                </svg>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="p-3 bg-light border-top d-flex justify-content-between align-items-center">
                        <a th:href="@{/products}" class="btn btn-outline-custom btn-sm">&larr; Continue Shopping</a>
                    </div>
                </div>
            </div>

            <!-- Order Summary Card -->
            <div class="col-lg-4">
                <div class="surface-card shadow-sm">
                    <h5 class="fw-bold mb-3 border-bottom pb-2">Cart Summary</h5>
                    <div class="d-flex justify-content-between align-items-baseline mb-4">
                        <span class="fw-bold h5 mb-0">Total Amount</span>
                        <span class="fw-bold h4 mb-0" style="color: var(--secondary);">₹<span th:text="${#numbers.formatDecimal(cart.totalPrice, 1, 2)}">0.00</span></span>
                    </div>
                    <a th:href="@{/checkout}" class="btn btn-primary-custom w-100 py-2 fw-bold">
                        Proceed to Checkout &rarr;
                    </a>
                </div>
            </div>
        </div>

        <!-- Empty Cart State -->
        <div th:unless="${cart != null and cart.items != null and !cart.items.isEmpty()}" class="text-center py-5">
            <div class="surface-card p-5 mx-auto" style="max-width: 480px;">
                <h4 class="fw-bold mb-2">Your Cart is Empty</h4>
                <p class="text-muted small mb-4">You have not added any products to your cart yet.</p>
                <a th:href="@{/products}" class="btn btn-primary-custom">Explore Products</a>
            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
