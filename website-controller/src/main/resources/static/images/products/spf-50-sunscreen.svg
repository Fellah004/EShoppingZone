<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sunBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <linearGradient id="sunBottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDFC"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="sunShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#EA580C" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#sunBg)"/>
  <g filter="url(#sunShadow)">
    <!-- Sunscreen Bottle/Flask Minimalist -->
    <rect x="145" y="80" width="110" height="230" rx="28" fill="url(#sunBottle)" stroke="#FDBA74" stroke-width="2"/>
    <!-- Cap Orange -->
    <path d="M 160 80 L 240 80 L 235 55 L 165 55 Z" fill="#EA580C" rx="4"/>
    <!-- Sunburst Symbol -->
    <circle cx="200" cy="140" r="18" fill="#FDBA74" opacity="0.4"/>
    <circle cx="200" cy="140" r="10" fill="#EA580C"/>
    <!-- Rays -->
    <line x1="200" y1="115" x2="200" y2="123" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="200" y1="157" x2="200" y2="165" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="175" y1="140" x2="183" y2="140" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="217" y1="140" x2="225" y2="140" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Text Elements -->
    <text x="200" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#0F172A" text-anchor="middle">SPF 50</text>
    <text x="200" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#EA580C" text-anchor="middle" letter-spacing="1.5">PA++++</text>
    <rect x="165" y="228" width="70" height="2" fill="#E2E8F0"/>
    <text x="200" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">Broad Spectrum</text>
    <text x="200" y="263" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#94A3B8" text-anchor="middle">Zero White Cast</text>
    <rect x="175" y="278" width="50" height="16" rx="8" fill="#EA580C"/>
    <text x="200" y="289" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#FFFDFC" text-anchor="middle">50 G</text>
  </g>
  <rect x="30" y="30" width="85" height="24" rx="12" fill="#EA580C"/>
  <text x="72" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFDFC" text-anchor="middle">SUN CARE</text>
</svg>
