<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="hoodieBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1DDD2"/>
      <stop offset="100%" stop-color="#E5DDD6"/>
    </linearGradient>
    <linearGradient id="hoodieFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <filter id="hoodieShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#292522" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#hoodieBg)"/>
  <g filter="url(#hoodieShadow)">
    <!-- Hood -->
    <path d="M 160 110 C 160 50, 240 50, 240 110 Z" fill="#1F2937"/>
    <!-- Body & Sleeves -->
    <path d="M 150 110 L 110 140 L 70 200 L 100 220 L 130 180 L 130 320 L 270 320 L 270 180 L 300 220 L 330 200 L 290 140 L 250 110 Z" fill="url(#hoodieFabric)"/>
    <!-- Kangaroo Pocket -->
    <path d="M 160 240 L 240 240 L 255 290 L 145 290 Z" fill="#1F2937" rx="4"/>
    <!-- Drawstrings -->
    <line x1="185" y1="115" x2="185" y2="175" stroke="#FFFDFC" stroke-width="3" stroke-linecap="round"/>
    <line x1="215" y1="115" x2="215" y2="185" stroke="#FFFDFC" stroke-width="3" stroke-linecap="round"/>
    <!-- Ribbed Hem -->
    <rect x="130" y="310" width="140" height="15" fill="#1F2937"/>
  </g>
  <rect x="30" y="30" width="85" height="24" rx="12" fill="#4B5563"/>
  <text x="72" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFDFC" text-anchor="middle">FLEECE 320</text>
</svg>
