<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ikigaiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="ikigaiCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="ikigaiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="10" stdDeviation="12" flood-color="#292522" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#ikigaiBg)"/>
  <g filter="url(#ikigaiShadow)">
    <rect x="110" y="60" width="180" height="280" rx="6" fill="#94A3B8"/>
    <rect x="120" y="60" width="170" height="280" rx="4" fill="url(#ikigaiCover)"/>
    <!-- Japanese Sun / Circle -->
    <circle cx="205" cy="140" r="32" fill="#E11D48" opacity="0.85"/>
    <text x="205" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="3">IKIGAI</text>
    <text x="205" y="235" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#334155" text-anchor="middle">The Japanese Secret to a</text>
    <text x="205" y="250" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#334155" text-anchor="middle">Long and Happy Life</text>
    <text x="205" y="295" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">Héctor García &amp; Francesc Miralles</text>
  </g>
  <rect x="30" y="30" width="80" height="24" rx="12" fill="#0284C7"/>
  <text x="70" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFDFC" text-anchor="middle">PHILOSOPHY</text>
</svg>
