<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1DDD2"/>
      <stop offset="100%" stop-color="#E5DDD6"/>
    </linearGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C97852"/>
      <stop offset="50%" stop-color="#8E6F61"/>
      <stop offset="100%" stop-color="#292522"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#292522" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#phoneBg)"/>
  <!-- Phone Body -->
  <g filter="url(#shadow)">
    <rect x="120" y="45" width="160" height="310" rx="28" fill="url(#phoneBody)" stroke="#4A5568" stroke-width="2"/>
    <!-- Screen -->
    <rect x="128" y="55" width="144" height="290" rx="20" fill="url(#screenGrad)"/>
    <!-- Camera Notch / Punch hole -->
    <circle cx="200" cy="72" r="5" fill="#0F172A"/>
    <!-- Screen UI Elements -->
    <rect x="145" y="110" width="110" height="12" rx="6" fill="#FFFDFC" opacity="0.8"/>
    <rect x="145" y="130" width="70" height="8" rx="4" fill="#FFFDFC" opacity="0.5"/>
    <!-- Abstract Screen Art -->
    <circle cx="200" cy="210" r="45" fill="#C97852" opacity="0.6"/>
    <path d="M 160 250 Q 200 180 240 250" stroke="#FFFDFC" stroke-width="3" fill="none" opacity="0.7"/>
    <!-- Home Bar -->
    <rect x="170" y="330" width="60" height="4" rx="2" fill="#FFFDFC" opacity="0.6"/>
  </g>
  <!-- Accent Badge -->
  <rect x="30" y="30" width="75" height="24" rx="12" fill="#C97852"/>
  <text x="67" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFDFC" text-anchor="middle">5G OLED</text>
</svg>
