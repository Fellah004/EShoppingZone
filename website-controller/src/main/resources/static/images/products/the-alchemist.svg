<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bookBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F6"/>
      <stop offset="100%" stop-color="#E5DDD6"/>
    </linearGradient>
    <linearGradient id="alchCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="bookShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="10" stdDeviation="12" flood-color="#292522" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bookBg1)"/>
  <g filter="url(#bookShadow)">
    <!-- Book Spine 3D illusion -->
    <rect x="110" y="60" width="180" height="280" rx="6" fill="#0F172A"/>
    <!-- Book Front Cover -->
    <rect x="120" y="60" width="170" height="280" rx="4" fill="url(#alchCover)"/>
    <!-- Gold Foil Details -->
    <circle cx="205" cy="160" r="38" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    <path d="M 205 130 L 205 190 M 175 160 L 235 160" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
    <polygon points="205,140 215,160 205,180 195,160" fill="#F59E0B" opacity="0.9"/>
    <!-- Title -->
    <text x="205" y="235" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#F59E0B" text-anchor="middle" letter-spacing="1">THE ALCHEMIST</text>
    <text x="205" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#E2E8F0" text-anchor="middle" letter-spacing="2">PAULO COELHO</text>
    <!-- Pages Edge -->
    <rect x="110" y="63" width="8" height="274" fill="#E2E8F0" opacity="0.4"/>
  </g>
  <rect x="30" y="30" width="80" height="24" rx="12" fill="#D97706"/>
  <text x="70" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFDFC" text-anchor="middle">BESTSELLER</text>
</svg>
