<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bookBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F6"/>
      <stop offset="100%" stop-color="#E5DDD6"/>
    </linearGradient>
    <linearGradient id="atomicCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDFC"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="atomicShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="10" stdDeviation="12" flood-color="#292522" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bookBg2)"/>
  <g filter="url(#atomicShadow)">
    <rect x="110" y="60" width="180" height="280" rx="6" fill="#CBD5E1"/>
    <rect x="120" y="60" width="170" height="280" rx="4" fill="url(#atomicCover)" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Atomic Dots Cluster -->
    <circle cx="175" cy="135" r="3" fill="#D97706"/>
    <circle cx="190" cy="130" r="4" fill="#D97706"/>
    <circle cx="210" cy="132" r="3.5" fill="#D97706"/>
    <circle cx="225" cy="140" r="3" fill="#D97706"/>
    <circle cx="205" cy="145" r="4.5" fill="#D97706"/>
    <circle cx="185" cy="148" r="3" fill="#D97706"/>
    <!-- Title -->
    <text x="205" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="-0.5">ATOMIC</text>
    <text x="205" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="-0.5">HABITS</text>
    <rect x="155" y="235" width="100" height="3" fill="#D97706"/>
    <text x="205" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">Tiny Changes, Remarkable Results</text>
    <text x="205" y="295" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">JAMES CLEAR</text>
  </g>
  <rect x="30" y="30" width="80" height="24" rx="12" fill="#C97852"/>
  <text x="70" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFDFC" text-anchor="middle">SELF HELP</text>
</svg>
