<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="fwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="fwShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#064E3B" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#fwBg)"/>
  <g filter="url(#fwShadow)">
    <!-- Tube Body inverted cone -->
    <path d="M 140 70 L 260 70 L 235 270 L 165 270 Z" fill="url(#tubeGrad)"/>
    <!-- Tube Top Heat Seal -->
    <rect x="135" y="60" width="130" height="15" rx="3" fill="#047857"/>
    <!-- Tube Cap Bottom -->
    <rect x="160" y="270" width="80" height="45" rx="8" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="2"/>
    <!-- Leaf / Herbal Emblem -->
    <circle cx="200" cy="145" r="28" fill="#ECFDF5" opacity="0.9"/>
    <path d="M 200 125 C 215 135, 215 155, 200 165 C 185 155, 185 135, 200 125 Z" fill="#059669"/>
    <line x1="200" y1="130" x2="200" y2="160" stroke="#ECFDF5" stroke-width="1.5"/>
    <!-- Product Text -->
    <text x="200" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#FFFDFC" text-anchor="middle" letter-spacing="1">PURIFYING</text>
    <text x="200" y="212" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#D1FAE5" text-anchor="middle">NEEM FACE WASH</text>
    <text x="200" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#F0FDF4" text-anchor="middle">150 ML</text>
  </g>
  <rect x="30" y="30" width="85" height="24" rx="12" fill="#059669"/>
  <text x="72" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFDFC" text-anchor="middle">HERBAL CARE</text>
</svg>
