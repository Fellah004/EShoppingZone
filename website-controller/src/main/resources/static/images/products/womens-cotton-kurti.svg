<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="kurtiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
    <linearGradient id="kurtiFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <filter id="kurtiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#292522" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#kurtiBg)"/>
  <g filter="url(#kurtiShadow)">
    <!-- Kurti Silhouette A-line with side slits -->
    <path d="M 160 80 L 120 110 L 80 150 L 105 180 L 135 155 L 140 330 L 190 330 L 190 270 L 210 270 L 210 330 L 260 330 L 265 155 L 295 180 L 320 150 L 280 110 L 240 80 Z" fill="url(#kurtiFabric)"/>
    <!-- Round Neck & Ethnic Motif -->
    <path d="M 175 80 Q 200 125 225 80" stroke="#FDF2F8" stroke-width="3" fill="none"/>
    <circle cx="200" cy="140" r="12" fill="#F472B6" opacity="0.8"/>
    <circle cx="200" cy="140" r="6" fill="#FDF2F8"/>
    <!-- Embroidered placket border -->
    <line x1="200" y1="125" x2="200" y2="240" stroke="#FBCFE8" stroke-width="3" stroke-dasharray="4,4"/>
    <circle cx="200" cy="170" r="3.5" fill="#FDF2F8"/>
    <circle cx="200" cy="200" r="3.5" fill="#FDF2F8"/>
    <circle cx="200" cy="230" r="3.5" fill="#FDF2F8"/>
  </g>
  <rect x="30" y="30" width="85" height="24" rx="12" fill="#DB2777"/>
  <text x="72" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFDFC" text-anchor="middle">ETHNIC WEAR</text>
</svg>
