<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="hpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F3EF"/>
      <stop offset="100%" stop-color="#E5DDD6"/>
    </linearGradient>
    <linearGradient id="hpAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C97852"/>
      <stop offset="100%" stop-color="#8E6F61"/>
    </linearGradient>
    <filter id="hpShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#292522" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#hpBg)"/>
  <g filter="url(#hpShadow)">
    <!-- Headband Arc -->
    <path d="M 120 200 C 120 90, 280 90, 280 200" fill="none" stroke="#292522" stroke-width="16" stroke-linecap="round"/>
    <path d="M 140 160 C 155 110, 245 110, 260 160" fill="none" stroke="#C97852" stroke-width="6" stroke-linecap="round"/>
    <!-- Left Ear Cup -->
    <rect x="95" y="180" width="40" height="90" rx="20" fill="#292522"/>
    <rect x="102" y="190" width="26" height="70" rx="13" fill="url(#hpAccent)"/>
    <!-- Right Ear Cup -->
    <rect x="265" y="180" width="40" height="90" rx="20" fill="#292522"/>
    <rect x="272" y="190" width="26" height="70" rx="13" fill="url(#hpAccent)"/>
    <!-- Inner Sound waves -->
    <circle cx="200" cy="240" r="16" fill="none" stroke="#8E6F61" stroke-width="2" opacity="0.4"/>
    <circle cx="200" cy="240" r="32" fill="none" stroke="#8E6F61" stroke-width="2" opacity="0.2"/>
  </g>
  <rect x="30" y="30" width="75" height="24" rx="12" fill="#8E6F61"/>
  <text x="67" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFDFC" text-anchor="middle">ANC BASS</text>
</svg>
