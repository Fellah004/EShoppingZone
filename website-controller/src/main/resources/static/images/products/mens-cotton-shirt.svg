<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="shirtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1DDD2"/>
      <stop offset="100%" stop-color="#E5DDD6"/>
    </linearGradient>
    <linearGradient id="shirtFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shirtShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#292522" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#shirtBg)"/>
  <g filter="url(#shirtShadow)">
    <!-- Shirt Silhouette -->
    <path d="M 150 90 L 120 120 L 70 160 L 100 200 L 130 170 L 130 330 L 270 330 L 270 170 L 300 200 L 330 160 L 280 120 L 250 90 Z" fill="url(#shirtFabric)"/>
    <!-- Collar -->
    <polygon points="150,90 200,140 180,90" fill="#1E40AF"/>
    <polygon points="250,90 200,140 220,90" fill="#1E40AF"/>
    <path d="M 180 90 Q 200 110 220 90" stroke="#FFFDFC" stroke-width="2" fill="none"/>
    <!-- Placket & Buttons -->
    <line x1="200" y1="140" x2="200" y2="330" stroke="#1E40AF" stroke-width="6"/>
    <circle cx="200" cy="170" r="4" fill="#FFFDFC"/>
    <circle cx="200" cy="210" r="4" fill="#FFFDFC"/>
    <circle cx="200" cy="250" r="4" fill="#FFFDFC"/>
    <circle cx="200" cy="290" r="4" fill="#FFFDFC"/>
    <!-- Pocket -->
    <path d="M 150 180 L 175 180 L 175 210 L 162.5 220 L 150 210 Z" fill="#2563EB" opacity="0.6"/>
  </g>
  <rect x="30" y="30" width="85" height="24" rx="12" fill="#2563EB"/>
  <text x="72" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFDFC" text-anchor="middle">100% COTTON</text>
</svg>
