server.port=${SERVER_PORT:8088}
spring.application.name=website-controller

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Service Endpoints for Feign Clients
services.profile-service.url=${PROFILE_SERVICE_URL:http://localhost:8081}
services.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
services.cart-service.url=${CART_SERVICE_URL:http://localhost:8083}
services.order-service.url=${ORDER_SERVICE_URL:http://localhost:8084}
services.wallet-service.url=${WALLET_SERVICE_URL:http://localhost:8085}



